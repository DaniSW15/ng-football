<div class="container">
  <app-page-header title="⚽ Equipos de Fútbol" subtitle="Gestiona tus equipos favoritos">
    <span class="badge">{{ store.teamCount() }} equipos</span>
  </app-page-header>

  <app-team-form (teamCreated)="onTeamCreated($event)" />

  @if (store.error(); as error) {
    <app-error-message [message]="error" />
  }

  <div class="team-grid">
    @for (team of store.teams(); track team.id) {
      <app-team-card [team]="team" />
    } @empty {
      <app-empty-state
        icon="⚽"
        message="No hay equipos registrados aún. ¡Crea el primero!"
      />
    }
  </div>
</div>
