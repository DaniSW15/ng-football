<h2>Agregar Equipo</h2>

<form [formRoot]="teamForm">
  <label>
    Nombre
    <input [formField]="teamForm.name" placeholder="Ej: Real Madrid" />
    @if (teamForm.name().invalid() && teamForm.name().touched()) {
      <span class="error-hint">El nombre es requerido (mínimo 2 caracteres)</span>
    }
  </label>

  <label>
    País
    <input [formField]="teamForm.country" placeholder="Ej: Spain" />
    @if (teamForm.country().invalid() && teamForm.country().touched()) {
      <span class="error-hint">El país es requerido (mínimo 2 caracteres)</span>
    }
  </label>

  <label>
    Año de fundación
    <input
      type="number"
      [formField]="teamForm.foundedYear"
      placeholder="Ej: 1902"
    />
    @if (teamForm.foundedYear().invalid() && teamForm.foundedYear().touched()) {
      <span class="error-hint">Año válido entre 1850 y 2030</span>
    }
  </label>

  <button type="submit" [disabled]="teamForm().submitting() || teamForm().invalid()">
    @if (teamForm().submitting()) {
      Creando...
    } @else {
      Crear equipo
    }
  </button>
</form>
