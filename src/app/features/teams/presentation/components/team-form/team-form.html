<section class="form-card" aria-labelledby="create-team-heading">
  <h2 id="create-team-heading">Agregar Equipo</h2>

  <form
    #formEl
    [formRoot]="teamForm"
    aria-labelledby="create-team-heading"
    novalidate
  >
    <div class="field">
      <label for="team-name">
        Nombre del equipo <span aria-hidden="true">*</span>
      </label>
      <span id="team-name-hint" class="hint">
        Entre 1 y 100 caracteres (ej. Real Madrid CF)
      </span>
      @let nameInvalid = teamForm.name().invalid() && teamForm.name().touched();
      <input
        id="team-name"
        type="text"
        [formField]="teamForm.name"
        placeholder="Ej: Real Madrid CF"
        [attr.aria-invalid]="nameInvalid ? 'true' : 'false'"
        [attr.aria-describedby]="
          nameInvalid ? 'team-name-hint team-name-error' : 'team-name-hint'
        "
      />
      @if (nameInvalid) {
        <span id="team-name-error" class="error-hint">
          <span role="img" aria-label="Error">❌</span>
          {{ teamForm.name().errors()[0]?.message ?? 'El nombre es obligatorio (1–100 caracteres).' }}
        </span>
      }
    </div>

    <button type="submit" [disabled]="teamForm().submitting()">
      @if (teamForm().submitting()) {
        Creando...
      } @else {
        Crear equipo
      }
    </button>
  </form>
</section>
