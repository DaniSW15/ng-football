<article class="competition-card">
  <div class="card-header">
    <h3>{{ competition().name }}</h3>
    <button class="btn-delete" (click)="onDelete()" title="Eliminar competición">🗑️</button>
  </div>

  <div class="badges">
    <span class="badge type">{{ getTypeLabel(competition().competitionType) }}</span>
    <span class="badge scope" [class.international]="competition().scope === 'international'">
      {{ getScopeLabel(competition().scope) }}
    </span>
    @if (competition().countryCode; as code) {
      <span class="badge country" title="País">📍 {{ code }}</span>
    }
  </div>

  <footer class="card-footer">
    <small>ID: {{ competition().id.slice(0, 8) }}...</small>
    <a
      [routerLink]="['/competitions', competition().id, 'seasons']"
      class="seasons-link"
    >
      📅 Temporadas
    </a>
  </footer>
</article>
